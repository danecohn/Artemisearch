use_default_settings: true
general:
  instance_name: Vigil Search
  debug: false
  enable_metrics: false
  contact_url: https://vigiltech.org/support
  privacypolicy_url: https://vigiltech.org/privacy
brand:
  new_issue_url: https://github.com/danecohn/amerikasocial/issues
  issue_url: https://github.com/danecohn/amerikasocial/issues
  custom:
    links:
      VigilTech: https://vigiltech.org/
      "Modified source (AGPL)": https://github.com/danecohn/Artemisearch
search:
  safe_search: 1
  autocomplete: ""
  formats: [html]
server:
  limiter: true
  image_proxy: true
  public_instance: false
  method: GET
ui:
  default_theme: simple
  theme_args:
    simple_style: light
  query_in_title: false
  results_on_new_tab: false
outgoing:
  request_timeout: 6
  max_request_timeout: 12
  pool_connections: 100
  pool_maxsize: 20
